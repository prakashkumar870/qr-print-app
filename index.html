<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Print</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f6f8;
    color: #222;
}

.app {
    max-width: 520px;
    margin: auto;
    padding: 18px;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

h1 {
    text-align: center;
    margin: 5px 0 8px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 20px;
}

h2 {
    font-size: 20px;
    margin-top: 5px;
}

.option {
    width: 100%;
    padding: 18px;
    margin: 8px 0;
    border: 2px solid #ddd;
    border-radius: 14px;
    background: white;
    font-size: 17px;
    text-align: left;
    font-weight: bold;
}

.option.active {
    border-color: #111827;
    background: #f0f3f7;
}

label {
    display: block;
    font-weight: bold;
    margin: 18px 0 8px;
}

.upload-box {
    border: 2px dashed #bbb;
    border-radius: 15px;
    padding: 18px;
    text-align: center;
    margin-top: 12px;
}

.camera-btn,
.gallery-btn,
.main-btn,
.back-btn {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 15px;
    margin-top: 10px;
    font-size: 16px;
    font-weight: bold;
}

.camera-btn {
    background: #111827;
    color: white;
}

.gallery-btn {
    background: #e9edf2;
    color: #222;
}

.main-btn {
    background: #16a34a;
    color: white;
}

.back-btn {
    background: #e5e7eb;
    color: #222;
}

input[type="file"] {
    display: none;
}

.preview-box {
    display: none;
    margin-top: 18px;
    text-align: center;
}

.preview-box img {
    max-width: 100%;
    max-height: 350px;
    border-radius: 12px;
    border: 1px solid #ddd;
}

.preview-title {
    font-weight: bold;
    margin-bottom: 10px;
}

select,
.number-input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}

.qty {
    display: flex;
    align-items: center;
    gap: 10px;
}

.qty button {
    width: 55px;
    height: 50px;
    border: none;
    border-radius: 10px;
    font-size: 25px;
    background: #e5e7eb;
}

.qty input {
    flex: 1;
    text-align: center;
    font-size: 20px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 10px;
}

.hidden {
    display: none;
}

.printer-info {
    text-align: center;
    background: #eef7ff;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 15px;
}

#result {
    display: none;
    margin-top: 18px;
    background: #e8f5e9;
    padding: 16px;
    border-radius: 12px;
    line-height: 1.7;
}
</style>
</head>

<body>

<div class="app">

<div class="card">

<h1>🖨️ QR Print</h1>

<div class="subtitle">
आसानी से अपना कागज Print करवाएँ
</div>

<div class="printer-info">
🖨️ <strong>Printer 1</strong><br>
Printer ID: PRINTER-1
</div>

<h2>आप क्या Print करवाना चाहते हैं?</h2>

<button class="option active" id="singleBtn"
onclick="selectType('single')">
📄 एक कागज / Document
</button>

<button class="option" id="frontBackBtn"
onclick="selectType('frontback')">
🪪 Front + Back एक ही Paper पर
</button>

<button class="option" id="pdfBtn"
onclick="selectType('pdf')">
📑 PDF / Multiple Pages
</button>

</div>


<!-- SINGLE DOCUMENT -->

<div class="card" id="singleSection">

<h2>📄 अपना कागज दें</h2>

<div class="upload-box">

<div>
📷 Camera से फोटो लें
</div>

<input
type="file"
id="singleCamera"
accept="image/*"
capture="environment"
onchange="showPreview(this,'singlePreview','singleImage')">

<label for="singleCamera" class="camera-btn">
📷 फोटो खींचें
</label>


<div>
🖼️ या Gallery से चुनें
</div>

<input
type="file"
id="singleGallery"
accept="image/*"
onchange="showPreview(this,'singlePreview','singleImage')">

<label for="singleGallery" class="gallery-btn">
🖼️ फोटो चुनें
</label>

</div>


<div class="preview-box" id="singlePreview">

<div class="preview-title">
👀 आपकी फोटो
</div>

<img id="singleImage">

<button class="back-btn"
onclick="resetSingle()">
🔄 दोबारा फोटो लें
</button>

</div>

</div>


<!-- FRONT BACK -->

<div class="card hidden" id="frontBackSection">

<h2>🪪 Front + Back</h2>

<p>दोनों तरफ की फोटो दें। दोनों एक ही Paper पर लगेंगी।</p>

<label>1️⃣ Front Side</label>

<div class="upload-box">

<input
type="file"
id="frontCamera"
accept="image/*"
capture="environment"
onchange="showPreview(this,'frontPreview','frontImage')">

<label for="frontCamera" class="camera-btn">
📷 Front की फोटो खींचें
</label>

<input
type="file"
id="frontGallery"
accept="image/*"
onchange="showPreview(this,'frontPreview','frontImage')">

<label for="frontGallery" class="gallery-btn">
🖼️ Front की फोटो चुनें
</label>

</div>

<div class="preview-box" id="frontPreview">
<img id="frontImage">
</div>


<label>2️⃣ Back Side</label>

<div class="upload-box">

<input
type="file"
id="backCamera"
accept="image/*"
capture="environment"
onchange="showPreview(this,'backPreview','backImage')">

<label for="backCamera" class="camera-btn">
📷 Back की फोटो खींचें
</label>

<input
type="file"
id="backGallery"
accept="image/*"
onchange="showPreview(this,'backPreview','backImage')">

<label for="backGallery" class="gallery-btn">
🖼️ Back की फोटो चुनें
</label>

</div>

<div class="preview-box" id="backPreview">
<img id="backImage">
</div>

</div>


<!-- PDF -->

<div class="card hidden" id="pdfSection">

<h2>📑 PDF / Document</h2>

<div class="upload-box">

<input
type="file"
id="pdfFile"
accept=".pdf,.jpg,.jpeg,.png"
onchange="showPdfName(this)">

<label for="pdfFile" class="gallery-btn">
📁 PDF / Document चुनें
</label>

<div id="pdfName"></div>

</div>

</div>


<!-- PRINT SETTINGS -->

<div class="card">

<h2>🖨️ Print Settings</h2>

<label>रंग कैसा चाहिए?</label>

<select id="printType">

<option value="bw">
⚫ Black & White
</option>

<option value="color">
🌈 Color
</option>

</select>


<label>कितनी Copy चाहिए?</label>

<div class="qty">

<button onclick="changeCopies(-1)">−</button>

<input
type="number"
id="copies"
value="1"
min="1"
readonly>

<button onclick="changeCopies(1)">+</button>

</div>


<button class="main-btn"
onclick="createOrder()">
🟢 Print Order बनाएँ
</button>

<div id="result"></div>

</div>

</div>


<script>

/* -------------------------
   DOCUMENT TYPE
------------------------- */

let selectedType = "single";

function selectType(type) {

    selectedType = type;

    document.getElementById("singleSection")
        .classList.toggle("hidden", type !== "single");

    document.getElementById("frontBackSection")
        .classList.toggle("hidden", type !== "frontback");

    document.getElementById("pdfSection")
        .classList.toggle("hidden", type !== "pdf");

    document.getElementById("singleBtn")
        .classList.toggle("active", type === "single");

    document.getElementById("frontBackBtn")
        .classList.toggle("active", type === "frontback");

    document.getElementById("pdfBtn")
        .classList.toggle("active", type === "pdf");
}


/* -------------------------
   IMAGE PREVIEW
------------------------- */

function showPreview(input, boxId, imageId) {

    const file = input.files[0];

    if (!file) return;

    const image =
        document.getElementById(imageId);

    image.src = URL.createObjectURL(file);

    document.getElementById(boxId)
        .style.display = "block";
}


/* -------------------------
   RESET SINGLE PHOTO
------------------------- */

function resetSingle() {

    document.getElementById("singleCamera").value = "";
    document.getElementById("singleGallery").value = "";

    document.getElementById("singlePreview")
        .style.display = "none";

    document.getElementById("singleImage")
        .src = "";
}


/* -------------------------
   PDF NAME
------------------------- */

function showPdfName(input) {

    const file = input.files[0];

    if (!file) return;

    document.getElementById("pdfName").innerHTML =
        "<br>✅ चुनी गई file: <strong>" +
        file.name +
        "</strong>";
}


/* -------------------------
   COPIES
------------------------- */

function changeCopies(amount) {

    const input =
        document.getElementById("copies");

    let value =
        parseInt(input.value) || 1;

    value += amount;

    if (value < 1) value = 1;

    input.value = value;
}


/* -------------------------
   CREATE ORDER
------------------------- */

function createOrder() {

    let valid = false;

    if (selectedType === "single") {

        valid =
            document.getElementById("singleCamera").files.length > 0 ||
            document.getElementById("singleGallery").files.length > 0;
    }

    if (selectedType === "frontback") {

        const front =
            document.getElementById("frontCamera").files.length > 0 ||
            document.getElementById("frontGallery").files.length > 0;

        const back =
            document.getElementById("backCamera").files.length > 0 ||
            document.getElementById("backGallery").files.length > 0;

        valid = front && back;
    }

    if (selectedType === "pdf") {

        valid =
            document.getElementById("pdfFile").files.length > 0;
    }


    if (!valid) {

        alert("कृपया पहले अपना document/photo दें।");

        return;
    }


    const copies =
        document.getElementById("copies").value;

    const type =
        document.getElementById("printType").value;

    const orderId =
        "QP-" +
        Date.now().toString().slice(-8);


    let documentType = "";

    if (selectedType === "single") {
        documentType = "एक Document";
    }

    if (selectedType === "frontback") {
        documentType = "Front + Back";
    }

    if (selectedType === "pdf") {
        documentType = "PDF / Document";
    }


    const result =
        document.getElementById("result");

    result.style.display = "block";

    result.innerHTML =

        "<strong>✅ Print Order तैयार है</strong><br><br>" +

        "<strong>Order ID:</strong> " +
        orderId +

        "<br>" +

        "<strong>Printer:</strong> PRINTER-1" +

        "<br>" +

        "<strong>Document:</strong> " +
        documentType +

        "<br>" +

        "<strong>Copies:</strong> " +
        copies +

        "<br>" +

        "<strong>Print:</strong> " +
        (type === "bw"
            ? "Black & White"
            : "Color") +

        "<br><br>" +

        "🟢 आपका order तैयार है।";

}

</script>

</body>
</html>
